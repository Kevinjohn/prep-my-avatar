# API-only mode: ComfyUI and ai-toolkit are host-native and out of scope for this container.
services:
  studio:
    build: .
    ports: ["5050:5050"]
    env_file:
      - .env
    volumes:
      - ./data-docker:/data
    environment:
      - LDS_CONFIG=/data/config.json
      - LDS_ENV=/data/.env
      - LDS_HOST=0.0.0.0
      - LDS_PORT=5050
      - LDS_ACCESS_TOKEN=${LDS_ACCESS_TOKEN:?Set LDS_ACCESS_TOKEN in .env before starting Docker}
