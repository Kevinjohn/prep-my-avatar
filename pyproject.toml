[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avatar-prep"
dynamic = ["version"]
description = "Local-first photo review, cropping, captions, and variety checks for reusable avatar model training"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow==12.3.0"]

[project.optional-dependencies]
vision = ["opencv-python-headless==4.9.0.80"]

[project.scripts]
avatar-prep = "avatar_prep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "avatar_prep.__version__"}

[tool.pytest.ini_options]
filterwarnings = ["error"]
