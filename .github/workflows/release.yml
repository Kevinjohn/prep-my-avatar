# Release automation: push a CalVer tag `vYYYY.MM.DD.N` and this builds the portable
# Windows bundle (packaging/build_portable.ps1) and publishes it as a GitHub
# Release. The release author is the github-actions bot. The in-app update
# check for PACKAGED builds compares the latest release tag against
# backend/app/version.py, so the tag MUST match APP_VERSION — enforced below.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the release + upload the asset

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Host python for PyInstaller only (the bundle ships its own standalone CPython).
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Validate release contract
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.3
          python scripts/validate_repository_contracts.py --release-tag "${{ github.ref_name }}"

      - name: Run the test suite
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -e . -r backend/requirements-dev.txt
          python -m pytest backend/tests -q
          python -m pytest tests -q
          python -m ruff check backend
          python -m pip_audit -r backend/requirements.txt --progress-spinner off
          python -m pip_audit -r backend/requirements-scrape.txt --progress-spinner off
          python -m pip_audit -r backend/requirements-ml.txt --progress-spinner off

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.21.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Verify the frontend
        shell: pwsh
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run gate
          pnpm audit --prod --audit-level high

      - name: Install release browser
        shell: pwsh
        working-directory: frontend
        run: pnpm exec playwright install chromium

      - name: Run browser E2E and accessibility checks
        shell: pwsh
        working-directory: frontend
        run: pnpm run e2e

      - name: Frontend build must be committed
        shell: pwsh
        run: git diff --exit-code -- frontend/dist

      - name: Build the portable bundle
        shell: pwsh
        run: ./packaging/build_portable.ps1

      - name: Smoke-test portable archive
        shell: pwsh
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP 'portable-smoke'
          Expand-Archive packaging/dist/LoRA-Dataset-Studio-win64.zip $smoke
          $bundle = Join-Path $smoke 'LoRA-Dataset-Studio'
          & (Join-Path $bundle 'python/python.exe') -m compileall -q (Join-Path $bundle 'backend')
          if ($LASTEXITCODE -ne 0) { throw 'portable backend compile smoke failed' }
          if (-not (Test-Path (Join-Path $bundle 'frontend/dist/index.html'))) {
            throw 'portable frontend bundle is missing'
          }
          if (-not (Test-Path (Join-Path $bundle 'LoRA Dataset Studio.exe'))) {
            throw 'portable launcher is missing'
          }
          foreach ($notice in 'LICENSE', 'NOTICE.md') {
            $noticePath = Join-Path $bundle $notice
            if (-not (Test-Path $noticePath)) { throw "portable bundle is missing $notice" }
          }
          if ((Get-Content (Join-Path $bundle 'NOTICE.md') -Raw) -notmatch 'prep-my-avatar') {
            throw 'portable NOTICE.md does not identify this fork'
          }
          & (Join-Path $bundle 'LoRA Dataset Studio.exe') --smoke-test
          if ($LASTEXITCODE -ne 0) {
            Get-Content (Join-Path $bundle 'data/server.log') -ErrorAction SilentlyContinue
            throw 'portable application smoke failed'
          }

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/publish_release.py
          --tag "${{ github.ref_name }}"
          --asset packaging/dist/LoRA-Dataset-Studio-win64.zip
