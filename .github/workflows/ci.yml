name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: '3.10' }
          - { os: ubuntu-latest, python: '3.11' }
          - { os: ubuntu-latest, python: '3.12' }
          - { os: windows-latest, python: '3.10' }
          - { os: windows-latest, python: '3.11' }
          - { os: windows-latest, python: '3.12' }
          # The desktop app is commonly run on macOS; one native lane catches
          # path, permission and process-lock behavior the Linux jobs cannot.
          - { os: macos-latest, python: '3.12' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -e . -r backend/requirements-dev.txt
      - name: Run backend tests
        run: python -m pytest backend/tests -q
      - name: Run subprocess and ComfyUI protocol contracts
        run: >-
          python -m pytest
          backend/tests/test_infer_workers.py
          backend/tests/test_comfyui_object_info_contract.py -q
      - name: Run package tests
        run: python -m pytest tests -q
      - name: Lint backend
        run: python -m ruff check backend

  python-dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        requirements:
          - backend/requirements.txt
          - backend/requirements-scrape.txt
          - backend/requirements-ml.txt
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      - name: Install audit tooling
        run: python -m pip install --disable-pip-version-check pip-audit==2.10.1
      - name: Audit ${{ matrix.requirements }}
        run: python -m pip_audit -r "${{ matrix.requirements }}" --progress-spinner off

  optional-python-installability:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: '3.10', requirements: backend/requirements-scrape.txt, imports: 'gallery_dl,yt_dlp,curl_cffi,brotli,bs4,cloudscraper,lxml' }
          - { os: ubuntu-latest, python: '3.11', requirements: backend/requirements-scrape.txt, imports: 'gallery_dl,yt_dlp,curl_cffi,brotli,bs4,cloudscraper,lxml' }
          - { os: ubuntu-latest, python: '3.12', requirements: backend/requirements-scrape.txt, imports: 'gallery_dl,yt_dlp,curl_cffi,brotli,bs4,cloudscraper,lxml' }
          - { os: ubuntu-latest, python: '3.11', requirements: backend/requirements-ml.txt, imports: 'insightface,onnxruntime,rembg,cv2,torch,PIL,numpy' }
          - { os: ubuntu-latest, python: '3.12', requirements: backend/requirements-ml.txt, imports: 'insightface,onnxruntime,rembg,cv2,torch,PIL,numpy' }
          - { os: windows-latest, python: '3.12', requirements: backend/requirements-ml.txt, imports: 'insightface,onnxruntime,rembg,cv2,torch,PIL,numpy' }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      - name: Install optional dependency graph
        run: python -m pip install --disable-pip-version-check -r "${{ matrix.requirements }}"
      - name: Import optional dependency graph
        env:
          OPTIONAL_IMPORTS: ${{ matrix.imports }}
        run: python -c "import importlib, os; [importlib.import_module(name) for name in os.environ['OPTIONAL_IMPORTS'].split(',')]"

  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install governance validator
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Validate repository contracts
        run: python scripts/validate_repository_contracts.py
      - name: Validate GitHub Actions workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.21.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Run frontend quality gate
        working-directory: frontend
        run: pnpm run gate
      - name: Audit production frontend dependencies
        working-directory: frontend
        run: pnpm audit --prod --audit-level high
      - name: Verify committed frontend build
        run: git diff --exit-code -- frontend/dist

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Build image
        run: docker build -t prep-my-avatar-ci .
      - name: Start container
        run: >-
          docker run -d --name prep-my-avatar-ci
          -e LDS_HOST=0.0.0.0 -e LDS_PORT=5050
          -e LDS_ACCESS_TOKEN=ci-container-health-token
          -p 5050:5050 prep-my-avatar-ci
      - name: Verify health endpoint
        shell: bash
        run: |
          for _ in {1..30}; do
            if curl --fail --silent -H 'Authorization: Bearer ci-container-health-token' http://127.0.0.1:5050/api/health/ready; then
              exit 0
            fi
            sleep 1
          done
          docker logs prep-my-avatar-ci
          exit 1

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.21.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser E2E and accessibility checks
        working-directory: frontend
        run: pnpm run e2e
